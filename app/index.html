<title>規範書房</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- local-room-service -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;800&display=swap">
<style>
/* Layout: the room is the stage (full-bleed, pannable on phones); HUD on top, dock at bottom, panels slide over it.
   Deliberately one look (a lamp-lit walnut library) in both host themes. */
:root{
  --night:#1b1511; --panel:rgba(30,23,18,.86); --panel-line:rgba(232,205,160,.16);
  --cream:#f5ecdc; --cream-dim:#cbbca5; --paper:#fbf6ec; --paper-2:#f2e9d9; --ink:#2b231d; --muted:#7a6c5e; --rule:#e2d6c2;
  --brass:#d3a453; --brass-deep:#9c7230; --forest:#2f5a46;
  --keep:#3f8a5f; --revise:#c8792a; --retire:#867b6d; --ask:#7369b4; --alert:#d4573b;
  --display:"Noto Serif TC","Songti TC",serif; --body:"Noto Sans TC","PingFang TC",-apple-system,sans-serif;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--cream);font:15px/1.6 var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr)}

/* HUD */
.hud{display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(var(--night),rgba(27,21,17,.6));z-index:5;min-width:0}
.brand{font:800 20px/1 var(--display);letter-spacing:.04em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--brass);color:var(--night);font-style:normal;font-size:16px}
.res{display:flex;gap:6px;margin-left:auto;min-width:0;overflow-x:auto;scrollbar-width:none}
.res::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--panel-line);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill b{font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.lampbar{display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
.lamps{display:flex;gap:3px}
.lamps span{width:9px;height:14px;border-radius:5px 5px 3px 3px;background:#4a3d31;transition:background .5s,box-shadow .5s}
.lamps span.on{background:var(--brass);box-shadow:0 0 8px var(--brass)}
.moods{display:flex;background:rgba(255,255,255,.06);border:1px solid var(--panel-line);border-radius:99px;padding:2px}
.moods button{padding:4px 10px;border-radius:99px;font-size:13px;color:var(--cream-dim)}
.moods button[aria-pressed=true]{background:var(--cream);color:var(--ink)}
.iconbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--panel-line);font-size:15px;flex:none}

/* Stage */
.local-status{position:absolute;top:10px;left:12px;right:12px;width:fit-content;max-width:calc(100% - 24px);z-index:5;padding:7px 11px;border-radius:10px;background:#241c15;color:#fff5e6;font-size:13px}
.local-status[hidden]{display:none}
.stage{position:relative;overflow:hidden;min-height:0;isolation:isolate;z-index:0}
.stage-bg{position:absolute;inset:-40px;background:url(room-sm.webp) center/cover;filter:blur(28px) brightness(.45);transform:scale(1.1)}
.scroller{position:absolute;inset:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;display:flex;align-items:center}
.scroller::-webkit-scrollbar{display:none}
.world{position:relative;isolation:isolate;flex:none;margin:auto;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);font-size:var(--u,10px)}
.world img.art{position:absolute;inset:0;width:100%;height:100%;display:block;transition:filter 1.2s}
.glow{position:absolute;width:14em;height:14em;margin:-7em 0 0 -7em;border-radius:50%;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(circle,rgba(255,206,120,.85),rgba(255,180,80,.25) 35%,transparent 68%);opacity:0;transition:opacity 1.2s,transform 1.2s;transform:scale(.6)}
.glow.on{opacity:var(--glow,.5);transform:scale(1)}
.glow.pop{animation:lamp-pop 1.4s ease-out}
@keyframes lamp-pop{0%{transform:scale(.4);opacity:0}40%{transform:scale(1.35);opacity:1}100%{transform:scale(1)}}
@property --r{syntax:'<percentage>';inherits:false;initial-value:0%}
.world img.art{filter:var(--base)}
.world[data-mood=day]{--base:brightness(.82) saturate(.85);--glow:.25}
.world[data-mood=warm]{--base:brightness(.62) saturate(.8) sepia(.12);--glow:.6}
.world[data-mood=night]{--base:brightness(.36) saturate(.65);--glow:1}
.world img.lit{filter:brightness(1.05) saturate(1.06);--r:0%;transition:--r 1.6s cubic-bezier(.2,.8,.2,1);-webkit-mask-image:radial-gradient(ellipse var(--r) calc(var(--r) * 1.45) at var(--x) var(--y),#000 45%,transparent 100%);mask-image:radial-gradient(ellipse var(--r) calc(var(--r) * 1.45) at var(--x) var(--y),#000 45%,transparent 100%);pointer-events:none}
.world img.lit.full{filter:brightness(1.1) saturate(1.1)}

/* Visitors */
.visitor{position:absolute;left:0;top:0;width:2.4em;height:4.2em;margin:-4.2em 0 0 -1.2em;pointer-events:none;will-change:transform}
.visitor .fig{position:absolute;inset:0;animation:bob .5s ease-in-out infinite alternate;animation-play-state:var(--walk,paused)}
.visitor .sh{position:absolute;left:.2em;right:.2em;bottom:-.25em;height:.6em;border-radius:50%;background:rgba(0,0,0,.28)}
.visitor .hd{position:absolute;left:.55em;top:0;width:1.3em;height:1.3em;border-radius:50%;background:#f1d2b4;box-shadow:inset 0 .35em 0 var(--hair)}
.visitor .bd{position:absolute;left:.4em;top:1.2em;width:1.6em;height:1.9em;border-radius:.7em .7em .35em .35em;background:var(--coat)}
.visitor .lg{position:absolute;top:3em;width:.5em;height:1.05em;border-radius:.25em;background:#3b3029}
.visitor .lg.l{left:.65em}.visitor .lg.r{left:1.25em}
.visitor.flip .fig{transform:scaleX(-1)}
.visitor.busy .fig::after,.visitor.reading .fig::after{content:"";position:absolute;left:.25em;top:1.7em;width:1.9em;height:.9em;border-radius:.15em;background:var(--book,#c99a4b);box-shadow:0 0 0 .08em rgba(0,0,0,.2)}
@keyframes bob{to{translate:0 -.25em}}

/* Hotspots */
.spot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:.35em;z-index:3}
.spot .tag{display:flex;align-items:center;gap:.5em;padding:.45em .9em .45em .55em;border-radius:99px;background:rgba(251,246,236,.94);color:var(--ink);font-size:max(12px,1.35em);font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25);white-space:nowrap;transition:transform .2s}
.spot .tag .ico{width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;background:var(--zc,var(--forest));color:#fff;font-size:.85em}
.spot:hover .tag,.spot.active .tag{transform:translateY(-3px) scale(1.04)}
.spot.active .tag{outline:3px solid var(--brass)}
.spot .stack{display:flex;gap:2px;align-items:flex-end;height:1.6em}
.spot .stack i{width:.55em;border-radius:2px 2px 1px 1px;background:var(--c);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.spot .alert{position:absolute;top:-.6em;right:-.6em;min-width:1.7em;height:1.7em;border-radius:99px;background:var(--alert);color:#fff;font-size:max(11px,1.05em);font-weight:700;display:grid;place-items:center;padding:0 .4em;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-4px)}}
.spot.cafe .tag{background:var(--brass);color:var(--night)}
.spot.cafe .tag .ico{background:var(--night);color:var(--brass)}

/* Dock */
.dock{display:flex;justify-content:center;gap:10px;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(rgba(27,21,17,.6),var(--night));z-index:5}
.dock button{display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--panel-line);font-weight:500;position:relative;white-space:nowrap}
.dock button.go{background:var(--brass);color:var(--night);border-color:transparent;font-weight:700;box-shadow:0 6px 24px rgba(211,164,83,.35)}
.dock button.go.alt{background:var(--cream);box-shadow:none}
.dock button.go:hover{filter:brightness(1.07)}
.dock button:disabled{opacity:.45;cursor:default}
.dock .n{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--ask);color:#fff;font-size:12px;display:inline-grid;place-items:center}
.dock button.go .n{background:var(--night);color:var(--brass)}
.zstrip{display:none}
.sync{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));font-size:12px;color:var(--cream-dim);display:flex;align-items:center;gap:6px}
.sync[hidden]{display:none}
.sync .dot{background:#777}.sync.cloud .dot{background:#59b27e;box-shadow:0 0 6px #59b27e}

/* Panels shared */
.scrim{position:fixed;inset:0;background:rgba(10,7,5,.5);backdrop-filter:blur(2px);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;z-index:21;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;transition:transform .32s cubic-bezier(.2,.8,.2,1);color-scheme:light}
.drawer{top:0;right:0;bottom:0;width:min(420px,100%);transform:translateX(105%);border-radius:20px 0 0 20px;box-shadow:-20px 0 60px rgba(0,0,0,.35)}
.drawer.on{transform:none}
.sheet{top:0;right:0;bottom:0;width:min(640px,100%);transform:translateX(105%);border-radius:20px 0 0 20px;z-index:23;box-shadow:-20px 0 60px rgba(0,0,0,.35)}
.sheet.on{transform:none}
.phead{padding:18px 20px 12px;padding-top:calc(18px + env(safe-area-inset-top,0px));display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--rule)}
.phead h2{margin:0;font:800 22px/1.3 var(--display);text-wrap:balance}
.phead .sub{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.close{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--paper-2);flex:none;font-size:18px;color:var(--muted)}
.pbody{flex:1;overflow-y:auto;padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px));min-height:0}
.search{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--rule);background:#fff;font:inherit;color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.chips button{padding:5px 11px;border-radius:99px;background:var(--paper-2);font-size:13px;color:var(--muted)}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.zonedesc{font-size:13px;color:var(--muted);margin:-4px 0 12px}
.book{display:flex;gap:12px;align-items:stretch;width:100%;text-align:left;padding:10px 10px 10px 0;border-radius:12px;transition:background .15s}
.book:hover{background:var(--paper-2)}
.spine{width:16px;border-radius:3px 6px 6px 3px;background:var(--zc);flex:none;position:relative;box-shadow:inset -3px 0 0 rgba(0,0,0,.15)}
.spine::after{content:"";position:absolute;left:3px;right:5px;top:8px;height:2px;background:rgba(255,255,255,.5)}
.book .t{flex:1;min-width:0}
.book .t strong{display:block;font-size:15px}
.book .t span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{align-self:center;font-size:11px;padding:3px 8px;border-radius:99px;white-space:nowrap;background:var(--paper-2);color:var(--muted)}
.st.keep{background:#dcefe2;color:#24583a}.st.revise{background:#f7e3cc;color:#7d4710}.st.retire{background:#e7e2db;color:#5d554b}.st.stale{background:#f6d9d2;color:#8e2f1b}
.bang{color:var(--alert);font-weight:800}
.src{display:inline-block;margin-left:6px;padding:0 6px;border-radius:5px;font-size:10.5px;font-weight:700;vertical-align:2px;background:#e9e3f5;color:#4b3f86}.src.codex{background:#e3eef3;color:#2c5266}
.book .t strong .bang{display:inline}
.uline{display:flex;align-items:center;gap:5px;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:2px}.uline i{width:7px;height:7px;border-radius:50%;flex:none}
.empty{padding:30px 10px;text-align:center;color:var(--muted)}

/* Detail */
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.meta span{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--paper-2);color:var(--muted)}
.decide{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:6px;padding:12px 20px;border-bottom:1px solid var(--rule)}
.decide button{padding:9px 6px;border-radius:10px;background:var(--paper-2);font-weight:500;font-size:14px}
.decide button[aria-pressed=true][data-s=keep]{background:var(--keep);color:#fff}
.decide button[aria-pressed=true][data-s=revise]{background:var(--revise);color:#fff}
.decide button[aria-pressed=true][data-s=retire]{background:var(--retire);color:#fff}
.decide .star{padding:9px 12px}
.decide .star[aria-pressed=true]{background:var(--brass);color:var(--night)}
.tabs{display:flex;gap:4px;padding:10px 20px 0;border-bottom:1px solid var(--rule)}
.tabs button{padding:8px 14px;border-radius:10px 10px 0 0;color:var(--muted);font-weight:500;border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--ink)}
.guide{display:grid;gap:16px}
.guide .one{font:600 19px/1.5 var(--display);color:var(--ink)}
.guide dt{font-size:12px;font-weight:700;color:var(--brass-deep);letter-spacing:.08em;margin-bottom:3px}
.guide dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.raw{font:12.5px/1.75 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--paper-2);border-radius:12px;padding:12px 14px;margin:0}
.raw .ln{display:inline-block;width:2.6em;color:#a8998a;user-select:none}
.readdone{margin-top:14px;width:100%;padding:13px;border-radius:12px;background:var(--forest);color:#fff;font-weight:700}
.readdone:disabled{background:var(--paper-2);color:var(--muted);cursor:default}
.ex{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8}
.askbtn{width:100%;padding:13px;border-radius:12px;background:var(--ask);color:#fff;font-weight:700;margin-top:6px}
.askbtn:disabled{opacity:.6}
.followup{display:flex;gap:8px;margin-top:14px}
.followup input{flex:1;min-width:0}
.note{font-size:12px;color:var(--muted);margin-top:8px}

/* Tidy (swipe) */
.tidy{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:radial-gradient(120% 80% at 50% 30%,rgba(60,42,28,.96),rgba(16,12,9,.99));opacity:0;pointer-events:none;transition:opacity .25s}
.tidy.on{opacity:1;pointer-events:auto}
.tbar{width:min(460px,100%);display:flex;align-items:center;gap:10px}
.pips{display:flex;gap:5px;flex:1}
.pips i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.14);transition:background .3s}
.pips i.done{background:var(--brass)}
.combo{font:800 15px var(--display);color:var(--brass);min-width:64px;text-align:right}
.combo.bump{animation:bump .35s}
.qtoggle{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--panel-line);font-size:12px;color:var(--cream-dim);white-space:nowrap}
.qtoggle i{width:30px;height:18px;border-radius:99px;background:rgba(255,255,255,.18);position:relative;transition:background .2s}
.qtoggle i::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--cream);transition:transform .2s}
.qtoggle[aria-checked=true]{color:var(--cream);border-color:rgba(91,224,143,.5)}
.qtoggle[aria-checked=true] i{background:#2fbf68}
.qtoggle[aria-checked=true] i::after{transform:translateX(12px)}
.quickzone{position:absolute;top:70px;bottom:120px;right:0;width:var(--qw,0px);display:none;align-items:center;justify-content:center;cursor:pointer;border-radius:24px 0 0 24px;transition:background .2s}
.tidy.quick .quickzone{display:flex}
.quickzone span{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:42px;color:rgba(91,224,143,.35);transition:color .2s,transform .2s}
.quickzone b{font-size:13px;font-weight:500;color:var(--cream-dim);opacity:.6}
.quickzone:hover{background:linear-gradient(90deg,transparent,rgba(47,191,104,.14))}
.quickzone:hover span{color:#5be08f;transform:scale(1.12)}
.quickzone:hover b{opacity:1}
.quickzone:active span{transform:scale(.95)}
@keyframes bump{40%{transform:scale(1.35)}}
.deck{position:relative;width:min(440px,100%);flex:1;max-height:600px;margin:18px 0 14px;perspective:1200px}
.card{position:absolute;inset:0;touch-action:none;user-select:none;cursor:grab;transform-style:preserve-3d;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s}
.card.drag{transition:none;cursor:grabbing}
.card.behind{transform:translateY(14px) scale(.95);filter:brightness(.8);pointer-events:none}
.card.behind2{transform:translateY(28px) scale(.9);filter:brightness(.65);pointer-events:none}
.face{position:absolute;inset:0;border-radius:22px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;box-shadow:0 28px 70px rgba(0,0,0,.5);overflow:hidden;color-scheme:light}
.photo{position:relative;flex:0 0 50%;background:var(--zc);overflow:hidden}
.pz{position:absolute;inset:0}
.pz.text{padding:34px 22px 18px;overflow-y:auto;background:linear-gradient(160deg,color-mix(in srgb,var(--zc) 22%,var(--paper)),var(--paper))}
.raw-peek pre{margin:0;font:12px/1.7 ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.ptabs{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:4px;z-index:3}
.ptabs i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.45);box-shadow:0 0 3px rgba(0,0,0,.3)}
.ptabs i.on{background:#fff}
.ptap{position:absolute;top:0;bottom:0;width:38%;z-index:2;cursor:pointer}
.ptap.l{left:0}.ptap.r{right:0}
.pcap{position:absolute;left:0;right:0;bottom:0;padding:48px 20px 14px;background:linear-gradient(transparent,rgba(12,8,5,.82));color:#fff;z-index:1;pointer-events:none}
.pcap h3{margin:0;font:800 30px/1.2 var(--display);text-shadow:0 2px 8px rgba(0,0,0,.4)}
.pcap .rar{margin-left:10px;font-size:15px;vertical-align:middle}
.pcap .sub{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;opacity:.92;margin-top:4px}
.tier{display:inline-block;padding:3px 11px;border-radius:99px;background:var(--tc);color:#fff;font-size:12px;font-weight:700;margin-bottom:6px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.seen{display:inline-flex;align-items:center;gap:6px}
.seen::before{content:"";width:8px;height:8px;border-radius:50%;background:#cbbca5}
.seen.on::before{background:#5be08f;box-shadow:0 0 8px #5be08f}
.seen.off{opacity:.75}
.bio{flex:1;min-height:0;overflow-y:auto;padding:14px 18px 14px;display:flex;flex-direction:column;gap:10px}
.bio .one{margin:0;font-size:15px;line-height:1.6}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.facts div{background:var(--paper-2);border-radius:12px;padding:8px 6px;text-align:center}
.facts b{display:block;font:800 17px/1.3 var(--display);font-variant-numeric:tabular-nums}
.facts span{display:block;font-size:11px;line-height:1.35;color:var(--muted)}
.advice{font-size:13px;font-weight:500;padding:8px 12px;border-radius:10px}
.advice.keep{background:#dcefe2;color:#24583a}.advice.drop{background:#f6ddd5;color:#8e2f1b}.advice.look{background:#f7ead0;color:#7a5410}
.bio .code{font:11px ui-monospace,monospace;color:var(--muted);overflow-wrap:anywhere}
.back-k{font-size:12px;font-weight:700;color:var(--brass-deep);letter-spacing:.08em}

<script>
(() => {

  {zone:'support',name:'藏書區',x:23,y:30,r:17},{zone:'writing',name:'閱讀長桌',x:50,y:44,r:14},{zone:'cafe',name:'咖啡廳',x:83,y:32,r:12},

const STATUS = {keep:'已保留',revise:'待修',retire:'封存',new:'未整理',stale:'原文已更新'};
const zoneOf = s => ZONES[s.zone] ? s.zone : 'support';

/* ---------- State ---------- */
let skills = [], marks = {}, explains = {}, db = null, sampleFn = null, canWrite = true;

let soundOn = ls.get('sr-sound', true);
let litBefore = null;

const stateOf = s => { const m = marks[s.key]; if (!m || !m.status) return 'new'; return m.hash !== s.hash ? 'stale' : m.status; };
const needsRead = s => (s.usage?.frequent || marks[s.key]?.star) && marks[s.key]?.readHash !== s.hash && stateOf(s) !== 'retire';
const queued = s => marks[s.key]?.queued && !(explains[s.key] && explains[s.key].hash === s.hash);
const cn = s => s.chinese && s.chinese.source_hash === s.hash ? s.chinese : null;
const pending = () => skills.filter(s => ['new','stale'].includes(stateOf(s)));
/* ---------- Stats & relations (shared by cards, reader and universe) ---------- */
let graphMemo = {sig: null, edges: [], deg: {}, nb: {}};
const STOP = new Set('the and for with when this that from into your use using used each only must should will about other more than then also have has are not what which where while user users skill skills file files make sure task tasks'.split(' '));
function tokens(s) {
  const c = cn(s) || {};
  const en = (s.name.replace(/[-_/.]/g, ' ') + ' ' + (s.description || '') + ' ' + (s.headings || []).map(h => h.title).join(' ')).toLowerCase().match(/[a-z][a-z0-9]{3,}/g) || [];
  const zh = [c.one, c.when, c.summary, s.alias].join('').replace(/[^一-鿿]/g, '');
  const set = new Set(en.filter(w => !STOP.has(w)));
  for (let i = 0; i < zh.length - 1; i++) set.add(zh.slice(i, i + 2));
  return set;
}
function graph() {
  const sig = skills.map(s => s.key + s.hash + (cn(s) ? 1 : 0)).join('|');
  if (graphMemo.sig === sig) return graphMemo;
  const T = new Map(skills.map(s => [s.key, tokens(s)])), edges = [], idx = new Map();
  const add = (a, b, kind, w) => {
    const k = a < b ? a + '>' + b : b + '>' + a, e = idx.get(k);
    if (e) { if (kind === 'mention') { e.kind = 'mention'; e.w = 1; } return; }
    const ne = {a, b, kind, w}; idx.set(k, ne); edges.push(ne);

  for (const s of skills) {

      const nm = o.name.toLowerCase();

    const w = e.kind === 'mention' ? 1.5 : 1;
    deg[e.a] = (deg[e.a] || 0) + w; deg[e.b] = (deg[e.b] || 0) + w;
    (nb[e.a] = nb[e.a] || []).push({key: e.b, kind: e.kind}); (nb[e.b] = nb[e.b] || []).push({key: e.a, kind: e.kind});

}
const clamp5 = v => Math.max(1, Math.min(5, Math.round(v)));
function stats(s) {
  const g = graph(), maxChats = Math.max(1, ...skills.map(x => x.usage?.chats || 0));
  const raw = s.raw || '', m = marks[s.key] || {}, ai = s.chinese || {};
  const strong = (raw.match(/\b(must|always|never|required|do not|don't|mandatory)\b|必須|一定要|不要|禁止|務必|不得/gi) || []).length;
  const use = s.usage ? (s.usage.chats ? 1 + 4 * Math.sqrt(s.usage.chats / maxChats) : 1) : (m.star ? 4 : null);

  ['imp', '重要', '#e0794f', '規則有多硬、出錯影響多大'],
  ['use', '常用', '#5fae7f', '最近 30 天被讀取的頻率'],

/* ---------- Storage: each viewer has a private library under data/users/<id>/lib ---------- */
let base = null, desktop = null, loaded = false, aiDenied = false, myUid = null, userApi = null, isOwner = false, fbItems = [];
let aiName = '';
const aiLabel = () => aiName || 'AI';

  ? '中文導讀和解釋使用你自己的 Claude 帳號。'

async function codexSample() {
  if (!localRoom || location.protocol !== 'http:' || location.hostname !== '127.0.0.1') return null;
  try {
    const status = await fetch('/api/codex/status', {signal: AbortSignal.timeout(2000)});
    if (!status.ok) return null;
    var info = await status.json(), available = info.available || (info.ai ? [info.ai] : []);

  } catch { return null; }

  async function ask(kind, input) {
    const prompt = typeof input === 'string' ? input : input.map(
      ({role, content}) => (role === 'assistant' ? '前次回答' : '使用者提問') + '\n' + content

function aiError(error) {
  if (error?.code === 'codex_error') return error.message;

}

/* ---------- Feedback to the author ---------- */
const FB_TYPES = [['like', '👍 喜歡'], ['bug', '🐞 有問題'], ['idea', '💡 建議'], ['how', '❓ 不會用']];
let fbType = 'idea';
function fbBadge() {
  const seen = ls.get('sr-fb-seen', ''), n = fbItems.filter(i => i.uid !== myUid && String(i.at) > seen).length;
  $('fbn').hidden = !n; $('fbn').textContent = n;
}
async function renderFb() {
  const inbox = isOwner && db;
  $('fbtitle').textContent = inbox ? '意見箱' : '回饋給作者';
  $('fbsub').textContent = inbox ? `同事的回饋・${fbItems.length} 則・只有你看得到` : db ? '作者會看到你的名字和內容' : '本機模式：會複製成文字，貼給作者就好';
  let names = {};
  if (inbox && userApi && fbItems.length) { try { names = await userApi.profiles([...new Set(fbItems.map(i => i.uid))]); } catch {} }
  const label = Object.fromEntries(FB_TYPES);
  const list = inbox ? (fbItems.length ? fbItems.map(i => `<div class="fbitem"><header><span><b>${esc(i.uid === myUid ? '你' : (names[i.uid]?.name || '同事'))}</b> · ${esc(label[i.type] || '')}</span><span>${esc(ago(i.at))}</span></header><p>${esc(i.text)}</p>${i.ctx ? `<small>${esc([i.ctx.env, i.ctx.ai, i.ctx.books + ' 本書', i.ctx.screen].filter(Boolean).join(' · '))}</small>` : ''}</div>`).join('') : '<p class="empty">還沒有回饋。分享給同事後，他們按 💬 寫的意見會出現在這裡。</p>') : '';
  const form = `${inbox ? '<div class="fbsec">自己也留一則</div>' : ''}<div class="fbtypes">${FB_TYPES.map(([k, n]) => `<button data-fbt="${k}" aria-pressed="${fbType === k}">${n}</button>`).join('')}</div>
    <textarea class="search fbtext" id="fbtext" placeholder="想跟作者說什麼？例如哪裡卡住、哪裡好玩、希望多什麼功能"></textarea>
    <label class="toggle" style="margin-top:8px"><input type="checkbox" id="fbctx" checked> 附上使用環境（不含 Skill 內容）</label>
    <button class="bigbtn" id="fbgo">${db ? '送出' : '複製回饋文字'}</button>`;
  $('fbody').innerHTML = list + form;
  $('fbody').querySelectorAll('[data-fbt]').forEach(b => b.onclick = () => { fbType = b.dataset.fbt; $('fbody').querySelectorAll('[data-fbt]').forEach(x => x.setAttribute('aria-pressed', x === b)); });

async function sendFb() {
  const text = $('fbtext').value.trim(); if (!text) { toast('寫一點內容再送出'); return; }
  const item = {type: fbType, text: text.slice(0, 4000), at: new Date().toISOString(),
    ctx: $('fbctx').checked ? {env: ENVS[envPick || detectEnv()]?.name || '', ai: aiName || '', books: skills.length, screen: `${innerWidth}×${innerHeight}`} : null};

/* ---------- Apply: turn decisions into one instruction for the user's own AI ---------- */
function applyPrompt(env, retire, revise) {

  const why = s => { const c = cn(s); return c?.one ? `：${c.one}` : ''; };
  if (env === 'claude-web') return `我整理過 Claude 的自訂 Skill，請幫我照下面處理：
${retire.length ? `\n【停用】這些我不要了。你不能直接改的話，告訴我在 Claude 設定裡怎麼一個個關掉：\n${list(retire)}\n` : ''}${revise.length ? `\n【待修】這些我覺得要改。逐份讀全文，各給我 1 到 3 個具體修改建議，等我確認再動手：\n${revise.map(s => `- ${s.name}${why(s)}`).join('\n')}\n` : ''}`;
  if (env === 'codex-web') return `我整理過這個 repo 裡的 Skill，請幫我照下面處理，做成一個 PR：
${retire.length ? `\n【封存】把這些 Skill 的資料夾移到 repo 根目錄的 skills-archive/，保留原本的資料夾名稱，不要刪除：\n${list(retire)}\n` : ''}${revise.length ? `\n【待修】這些先不要改。逐份讀全文，在 PR 說明裡各列 1 到 3 個具體修改建議：\n${revise.map(s => `- ${s.name}${why(s)}`).join('\n')}\n` : ''}
PR 說明用中文列出每一份做了什麼。`;
  const dirs = env === 'codex-local' ? '~/.codex/skills' : '~/.claude/skills 或 ~/.codex/skills';
  return `我整理過自己的 Skill，請幫我照下面處理：
${retire.length ? `\n【封存】在 ${dirs} 找到這些 Skill 的資料夾，移到同一層的「skills-archive」資料夾（例如 ~/.codex/skills-archive/名稱）。不要刪除；找不到或同名衝突的跳過並告訴我：\n${list(retire)}\n` : ''}${revise.length ? `\n【待修】這些先不要改。逐份讀全文，各給我 1 到 3 個具體修改建議，等我確認再動手：\n${revise.map(s => `- ${s.name}${why(s)}`).join('\n')}\n` : ''}

}
